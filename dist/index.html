<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fbf6e9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="點心旅行：100 關手繪食物三消，滑動交換、連鎖消除、趣味障礙與音效。"><title>點心旅行 · Snack Trip</title><link rel="stylesheet" href="style.css?v=4"></head><body>
<div class="app"><header><button id="mapBtn" class="iconbtn" aria-label="關卡地圖">☷</button><div class="brand">點心旅行<span>SNACK TRIP</span></div><button id="settingsBtn" class="iconbtn" aria-label="設定">⚙</button></header>
